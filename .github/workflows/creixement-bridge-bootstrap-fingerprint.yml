name: Creixement Bridge Bootstrap Fingerprint

on:
  push:
    branches:
      - production/creixement-kairon

permissions:
  contents: read

jobs:
  read-production-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read one-way credential fingerprint from production Worker
        shell: bash
        run: |
          set -euo pipefail
          url='https://creixement-kairon.nikitamakiel1.workers.dev/diagz'
          last='{}'
          for attempt in $(seq 1 20); do
            payload="$(curl --fail-with-body --silent --show-error --max-time 20 "$url" || true)"
            last="$payload"
            fingerprint="$(PAYLOAD="$payload" python - <<'PY'
          import json, os
          try:
            d=json.loads(os.environ.get('PAYLOAD') or '{}')
            print((d.get('configuration') or {}).get('bootstrapCredentialFingerprint') or '')
          except Exception:
            print('')
          PY
            )"
            if [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
              echo "BOOTSTRAP_CREDENTIAL_SHA256=$fingerprint"
              exit 0
            fi
            sleep 6
          done
          echo 'Fingerprint not available from production Worker. Last safe diagnostic:' >&2
          printf '%s\n' "$last" | python -m json.tool || printf '%s\n' "$last"
          exit 1
