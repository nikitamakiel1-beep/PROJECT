name: Creixement Credits-Free UI

on:
  push:
    branches:
      - venture/creixement-kairon-v9-fullstack-no-credits
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.env.example'
      - '.github/workflows/creixement-fullstack-ui.yml'

permissions:
  contents: read

concurrency:
  group: creixement-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install UI dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck UI
        run: npm run check
      - name: Build UI
        run: npm run build
      - name: Verify truth-first and browser-secret boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q 'KAIRON V9.2' src/App.tsx
          grep -q 'v_runtime_proof_summary_v9' src/App.tsx
          grep -q 'v_runtime_cadence_proof_v9' src/App.tsx
          grep -q 'configuration_never_rendered_as_execution' config/creixement-kairon-v9.json
          grep -q 'Never put service_role' .env.example
          if grep -RniE 'SUPABASE_SERVICE_ROLE_KEY=|CRON_SECRET=|CREIXEMENT_OWNER_TOKEN=|CREIXEMENT_API_TOKEN=' . --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md'; then
            echo 'A server-side secret appears to be assigned in browser/repository files.'
            exit 1
          fi
          node -e "const p=require('./package.json'); if(p.version!=='0.9.2') process.exit(1)"
          echo 'credits-free UI build and browser-secret boundary verified'
