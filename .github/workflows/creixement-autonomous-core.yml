name: Creixement Autonomous Core

on:
  push:
    branches:
      - venture/creixement-control-plane-cloud-v1
      - venture/creixement-overhaul-v3
      - venture/creixement-overhaul-v4
      - venture/creixement-overhaul-v5
      - venture/creixement-overhaul-v6-converged
      - venture/creixement-kairon-v7
      - venture/creixement-kairon-v8-autonomic
      - production/creixement-kairon
  pull_request:
    paths:
      - 'cloud/creixement-agent-core/**'
      - 'cloud/creixement-runtime/**'
      - 'cloud/creixement-cloudflare-runtime/**'
      - 'db/migrations/**'
      - 'config/creixement-*.json'
      - 'docs/architecture/CREIXEMENT_*.md'
      - '.github/workflows/creixement-autonomous-core.yml'

permissions:
  contents: read

concurrency:
  group: creixement-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install core dependencies
        run: npm install --no-audit --no-fund
      - name: Core typecheck
        run: npm run check
      - name: Core unit tests
        run: npm test

  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Runtime typecheck
        run: npm run check
      - name: Runtime unit tests
        run: npm test
      - name: Runtime build
        run: npm run build

  validate-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-cloudflare-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Cloudflare runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Cloudflare typecheck
        run: npm run check
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run

  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Creixement JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(config/creixement-*.json)
          if [ ${#files[@]} -eq 0 ]; then echo 'No Creixement JSON contracts found'; exit 1; fi
          for file in "${files[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('valid json:', process.argv[1])" "$file"
          done
      - name: Validate ordered migrations and Kairon V8 contracts
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            db/migrations/002_autonomous_economic_brain.sql
            db/migrations/003_cloud_runtime_fabric.sql
            db/migrations/004_overhaul_v3_runtime_governance.sql
            db/migrations/005_overhaul_v4_company_os.sql
            db/migrations/006_v4_initial_operating_backlog.sql
            db/migrations/007_v4_goal_execution_semantics.sql
            db/migrations/008_v4_production_trust_fabric.sql
            db/migrations/009_v5_runtime_convergence.sql
            db/migrations/010_v6_autonomic_operations.sql
            db/migrations/011_v6_invariant_guards.sql
            db/migrations/012_v6_resilience_and_release_integrity.sql
            db/migrations/013_v6_verified_evidence_gates.sql
            db/migrations/014_v7_kairon_autonomous_operator.sql
            db/migrations/015_v7_kairon_schema_convergence.sql
            db/migrations/016_v8_kairon_runtime_contract.sql
            db/migrations/017_v8_release_attestation.sql
          )
          for migration in "${migrations[@]}"; do test -f "$migration"; done
          grep -q 'execution_mode' db/migrations/007_v4_goal_execution_semantics.sql
          grep -q 'request_nonces_v4' db/migrations/008_v4_production_trust_fabric.sql
          grep -q 'runtime_heartbeats_v5' db/migrations/009_v5_runtime_convergence.sql
          grep -q 'creixement_handler_circuit_decision_v6' db/migrations/010_v6_autonomic_operations.sql
          grep -q 'creixement_reap_expired_leases_v6' db/migrations/012_v6_resilience_and_release_integrity.sql
          grep -q 'release_evidence_v6' db/migrations/013_v6_verified_evidence_gates.sql
          grep -q 'as active_bindings' db/migrations/013_v6_verified_evidence_gates.sql
          grep -q 'as ci_green' db/migrations/013_v6_verified_evidence_gates.sql
          grep -q 'kairon_state_v7' db/migrations/014_v7_kairon_autonomous_operator.sql
          grep -q 'v_kairon_command_v7' db/migrations/015_v7_kairon_schema_convergence.sql
          ! grep -q 'ci_verified_green' db/migrations/015_v7_kairon_schema_convergence.sql
          grep -q 'creixement_kairon_preflight_v8' db/migrations/016_v8_kairon_runtime_contract.sql
          grep -q 'escalation_details' db/migrations/016_v8_kairon_runtime_contract.sql
          grep -q '017_v8_release_attestation.sql' db/migrations/017_v8_release_attestation.sql
          grep -q 'production/creixement-kairon' db/migrations/017_v8_release_attestation.sql
          grep -q 'deployment_evidence_verified' db/migrations/017_v8_release_attestation.sql
          test -f config/creixement-kairon-v8.json
          node -e "const c=require('./config/creixement-kairon-v8.json'); if(c.operator.name!=='Kairon'||c.operator.autonomy_ceiling!=='L2'||c.operator.production_branch!=='production/creixement-kairon'||c.runtime.version!=='0.8.0'||c.runtime.migration_head!=='017_v8_release_attestation.sql') process.exit(1)"
          test -f cloud/creixement-agent-core/src/kairon.ts
          test -f cloud/creixement-agent-core/src/kairon.test.ts
          grep -q 'creixement_kairon_preflight_v8' cloud/creixement-runtime/src/handlers.ts
          grep -q 'escalation_details' cloud/creixement-runtime/src/handlers.ts
          test -f cloud/creixement-cloudflare-runtime/src/index.ts
          grep -q '/api/kairon' cloud/creixement-cloudflare-runtime/src/index.ts
          grep -q '/api/release-evidence' cloud/creixement-cloudflare-runtime/src/index.ts
          grep -q '\*/5 \* \* \* \*' cloud/creixement-cloudflare-runtime/wrangler.toml
          grep -q 'production/creixement-kairon' cloud/creixement-cloudflare-runtime/wrangler.toml
          node -e "const p=require('./cloud/creixement-runtime/package.json'); if(p.version!=='0.8.0') process.exit(1)"
          node -e "const p=require('./cloud/creixement-cloudflare-runtime/package.json'); if(p.version!=='0.8.0') process.exit(1)"
          echo 'ordered migrations and Kairon v8 contracts present'
      - name: Reject active local-runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'Tectum Local Bridge|local_runtime_required|desktop Excel COM|local AutoPPTX' config cloud docs/architecture/CREIXEMENT_AUTONOMOUS_ECONOMIC_BRAIN_V2.md; then
            echo 'Active local-runtime regression detected.'
            exit 1
          fi
          echo 'cloud-only runtime boundary preserved'
