name: Creixement Autonomous Core

on:
  push:
    branches:
      - venture/creixement-control-plane-cloud-v1
      - venture/creixement-overhaul-v3
      - venture/creixement-overhaul-v4
      - venture/creixement-overhaul-v5
      - venture/creixement-overhaul-v6-converged
      - venture/creixement-kairon-v7
      - venture/creixement-kairon-v8-autonomic
      - venture/creixement-kairon-v9-bioecology
      - venture/creixement-kairon-v9-observability
      - venture/creixement-kairon-v9-fullstack-no-credits
      - 'codex/**'
      - production/creixement-kairon
  pull_request:
    paths:
      - 'cloud/creixement-agent-core/**'
      - 'cloud/creixement-runtime/**'
      - 'cloud/creixement-cloudflare-runtime/**'
      - 'db/migrations/**'
      - 'config/creixement-*.json'
      - 'docs/architecture/CREIXEMENT_*.md'
      - '.github/workflows/creixement-autonomous-core.yml'

permissions:
  contents: read

concurrency:
  group: creixement-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install core dependencies
        run: npm install --no-audit --no-fund
      - name: Core typecheck
        run: npm run check
      - name: Core unit tests
        run: npm test

  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Runtime typecheck
        run: npm run check
      - name: Runtime unit tests
        run: npm test
      - name: Runtime build
        run: npm run build

  validate-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-cloudflare-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Cloudflare runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Cloudflare typecheck
        run: npm run check
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run
      - name: Counteraudit Kairon V10 release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'main = "src/entry.ts"' wrangler.toml
          grep -q 'crons = \["\*/5 \* \* \* \*"\]' wrangler.toml
          grep -q 'CREIXEMENT_RUNTIME_ID = "kairon-cloudflare-v10"' wrangler.toml
          grep -q 'CREIXEMENT_RUNTIME_VERSION = "1.0.0"' wrangler.toml
          grep -q 'WORKERS_CI_COMMIT_SHA' scripts/deploy-ci.mjs
          grep -q 'kairon-cloudflare-v10' scripts/deploy-ci.mjs
          grep -q 'CREIXEMENT_RUNTIME_VERSION:1.0.0' scripts/deploy-ci.mjs
          grep -q 'runtimeVersion: "1.0.0"' scripts/deploy-ci.mjs
          grep -q '/diagz' src/entry.ts
          test -f src/diagnostics.ts
          node -e "const p=require('./package.json'); if(p.scripts['deploy:ci']!=='node scripts/deploy-ci.mjs'||p.version!=='1.0.0') process.exit(1)"

  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Creixement JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(config/creixement-*.json)
          if [ ${#files[@]} -eq 0 ]; then echo 'No Creixement JSON contracts found'; exit 1; fi
          for file in "${files[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('valid json:', process.argv[1])" "$file"
          done
      - name: Validate ordered migrations and Kairon V10 contracts
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            db/migrations/002_autonomous_economic_brain.sql
            db/migrations/003_cloud_runtime_fabric.sql
            db/migrations/004_overhaul_v3_runtime_governance.sql
            db/migrations/005_overhaul_v4_company_os.sql
            db/migrations/006_v4_initial_operating_backlog.sql
            db/migrations/007_v4_goal_execution_semantics.sql
            db/migrations/008_v4_production_trust_fabric.sql
            db/migrations/009_v5_runtime_convergence.sql
            db/migrations/010_v6_autonomic_operations.sql
            db/migrations/011_v6_invariant_guards.sql
            db/migrations/012_v6_resilience_and_release_integrity.sql
            db/migrations/013_v6_verified_evidence_gates.sql
            db/migrations/014_v7_kairon_autonomous_operator.sql
            db/migrations/015_v7_kairon_schema_convergence.sql
            db/migrations/016_v8_kairon_runtime_contract.sql
            db/migrations/017_v8_release_attestation.sql
            db/migrations/018_v9_conway_bioecology.sql
            db/migrations/019_v9_conway_adversarial_courts.sql
            db/migrations/020_v9_population_and_courts_runtime.sql
            db/migrations/021_v9_runtime_proof_and_scheduler_autoverify.sql
            db/migrations/022_v10_business_portfolio_and_venture_foundry.sql
          )
          for migration in "${migrations[@]}"; do test -f "$migration"; done
          test -f config/creixement-kairon-v10.json
          test -f config/creixement-kairon-supervisor-v10.json
          test -f config/creixement-business-portfolio-v10.json
          node -e "const c=require('./config/creixement-kairon-v10.json'); if(c.operator.name!=='Kairon'||c.operator.autonomy_ceiling!=='L2'||c.operator.production_branch!=='production/creixement-kairon'||c.runtime.version!=='1.0.0'||c.runtime.runtime_id!=='kairon-cloudflare-v10'||c.runtime.migration_head!=='022_v10_business_portfolio_and_venture_foundry.sql'||c.business.first_operating_project!=='Tectum'||c.business.executive_agent!=='Kairon') process.exit(1)"
          node -e "const c=require('./config/creixement-kairon-supervisor-v10.json'); if(c.operator!=='Kairon'||c.role!=='chief-operator'||c.autonomyCeiling!=='L2'||c.businessArchitecture.firstOperatingProject!=='Tectum') process.exit(1)"
          node -e "const c=require('./config/creixement-business-portfolio-v10.json'); if(c.executiveAgent!=='Kairon'||c.firstOperatingProject!=='Tectum') process.exit(1)"
          grep -q 'creixement_run_venture_foundry_v10' db/migrations/022_v10_business_portfolio_and_venture_foundry.sql
          grep -q 'business.venture_foundry_cycle' db/migrations/022_v10_business_portfolio_and_venture_foundry.sql
          grep -q 'runtime_heartbeat_samples_v9' db/migrations/021_v9_runtime_proof_and_scheduler_autoverify.sql
          grep -q 'creixement.runtime.heartbeat_failure' cloud/creixement-runtime/src/tick.ts
          node -e "const p=require('./cloud/creixement-runtime/package.json'); if(p.version!=='1.0.0') process.exit(1)"
          echo 'Kairon V10 runtime, portfolio, migrations and proof contracts present'
      - name: Reject active local-runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'Tectum Local Bridge|local_runtime_required|desktop Excel COM|local AutoPPTX' config cloud docs/architecture/CREIXEMENT_AUTONOMOUS_ECONOMIC_BRAIN_V2.md; then
            echo 'Active local-runtime regression detected.'
            exit 1
          fi
          echo 'cloud-only runtime boundary preserved'

  deploy-cloudflare-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production/creixement-kairon'
    needs: [validate-core, validate-runtime, validate-cloudflare, validate-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloud/creixement-cloudflare-runtime
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_CI: '1'
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      WORKERS_CI_BRANCH: production/creixement-kairon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN repository secret is required'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID repository secret is required'; exit 2; }
      - name: Install Cloudflare runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy attested Kairon V10 production Worker
        run: npm run deploy:ci
