name: Creixement Autonomous Core

on:
  push:
    branches:
      - venture/creixement-control-plane-cloud-v1
      - venture/creixement-overhaul-v3
  pull_request:
    paths:
      - 'cloud/creixement-agent-core/**'
      - 'db/migrations/**'
      - 'config/creixement-*.json'
      - 'docs/architecture/CREIXEMENT_*.md'
      - '.github/workflows/creixement-autonomous-core.yml'

permissions:
  contents: read

concurrency:
  group: creixement-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/creixement-agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Validate Creixement JSON contracts
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(config/creixement-*.json)
          if [ ${#files[@]} -eq 0 ]; then echo 'No Creixement JSON contracts found'; exit 1; fi
          for file in "${files[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('valid json:', process.argv[1])" "$file"
          done
      - name: Reject active local-runtime regressions
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # Historical/migration documentation may mention retired desktop mechanisms in a negative context.
          # This gate targets active contracts/runtime code only.
          if grep -RniE 'Tectum Local Bridge|local_runtime_required' config cloud/creixement-agent-core docs/architecture/CREIXEMENT_AUTONOMOUS_ECONOMIC_BRAIN_V2.md; then
            echo 'Active local-runtime regression detected.'
            exit 1
          fi
          echo 'cloud-only runtime boundary preserved'
