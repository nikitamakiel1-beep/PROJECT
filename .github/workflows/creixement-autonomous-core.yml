name: Creixement Autonomous Core

on:
  push:
    branches:
      - 'codex/**'
      - production/creixement-kairon
  pull_request:
    paths:
      - 'cloud/creixement-agent-core/**'
      - 'cloud/creixement-runtime/**'
      - 'db/migrations/**'
      - 'config/creixement-*.json'
      - 'docs/architecture/CREIXEMENT_*.md'
      - '.github/workflows/creixement-autonomous-core.yml'

permissions:
  contents: read

concurrency:
  group: creixement-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Core typecheck
        run: npm run check
      - name: Core unit tests
        run: npm test

  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Runtime typecheck
        run: npm run check
      - name: Runtime unit tests
        run: npm test
      - name: Runtime build
        run: npm run build

  validate-vercel-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloud/creixement-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Counteraudit V11 compute boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f vercel.json
          test -f api/tick.ts
          test -f api/diagz.ts
          grep -q '"api/\*.ts"' vercel.json
          if grep -q '"crons"' vercel.json; then
            echo 'Vercel Cron must not be authoritative on the Hobby plan.'
            exit 1
          fi
          grep -q 'kairon-vercel-v11' src/env.ts
          grep -q 'v_runtime_proof_summary_v11' src/kaironSupervisorHandler.ts
          grep -q 'primary_scheduler_verified' src/kaironSupervisorHandler.ts
          grep -q 'cloudflareAuthoritative: false' api/diagz.ts
          node -e "const p=require('./package.json'); if(p.version!=='1.1.0') process.exit(1)"

  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Creixement JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(config/creixement-*.json)
          if [ ${#files[@]} -eq 0 ]; then exit 1; fi
          for file in "${files[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$file"
          done
      - name: Validate Kairon V11 migration and constitutional boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f db/migrations/024_v11_vercel_supabase_runtime_migration.sql
          test -f config/creixement-kairon-v11.json
          node - <<'NODE'
          const c=require('./config/creixement-kairon-v11.json');
          if(c.operator.name!=='Kairon'||c.operator.autonomy_ceiling!=='L2') process.exit(1);
          if(c.runtime.runtime_id!=='kairon-vercel-v11'||c.runtime.version!=='1.1.0') process.exit(1);
          if(c.runtime.primary!=='vercel-functions'||c.runtime.scheduler.provider!=='supabase-pg-cron') process.exit(1);
          if(c.runtime.scheduler.vercel_cron_authoritative!==false) process.exit(1);
          if(c.runtime.migration_head!=='024_v11_vercel_supabase_runtime_migration.sql') process.exit(1);
          if(c.business.first_operating_project!=='Tectum'||c.business.executive_agent!=='Kairon') process.exit(1);
          NODE
          grep -q 'create extension if not exists pg_cron' db/migrations/024_v11_vercel_supabase_runtime_migration.sql
          grep -q 'create extension if not exists pg_net' db/migrations/024_v11_vercel_supabase_runtime_migration.sql
          grep -q 'supabase-pg-cron-kairon-v11' db/migrations/024_v11_vercel_supabase_runtime_migration.sql
          grep -q 'creixement_auto_verify_primary_scheduler_v11' db/migrations/024_v11_vercel_supabase_runtime_migration.sql
          grep -q "runtime_id='kairon-cloudflare-v10'" db/migrations/024_v11_vercel_supabase_runtime_migration.sql
          grep -q "set active=false" db/migrations/024_v11_vercel_supabase_runtime_migration.sql
          grep -q 'cloudflareAuthoritative' config/creixement-kairon-v11.json
          grep -q 'creixement.runtime.heartbeat_failure' cloud/creixement-runtime/src/tick.ts
      - name: Reject local-runtime and Cloudflare-authority regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'Tectum Local Bridge|local_runtime_required|desktop Excel COM|local AutoPPTX' config cloud/creixement-runtime docs/architecture/CREIXEMENT_AUTONOMOUS_ECONOMIC_BRAIN_V2.md; then
            exit 1
          fi
          if grep -RniE 'primary.*cloudflare|cloudflare.*authoritative|release_channel.*cloudflare-workers' config/creixement-kairon-v11.json; then
            exit 1
          fi
          echo 'Kairon V11 managed-cloud boundary preserved'
