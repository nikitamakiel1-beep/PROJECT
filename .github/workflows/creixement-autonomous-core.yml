name: Creixement Autonomous Core

on:
  push:
    branches:
      - venture/creixement-control-plane-cloud-v1
      - venture/creixement-overhaul-v3
      - venture/creixement-overhaul-v4
      - venture/creixement-overhaul-v5
  pull_request:
    paths:
      - 'cloud/creixement-agent-core/**'
      - 'cloud/creixement-runtime/**'
      - 'db/migrations/**'
      - 'config/creixement-*.json'
      - 'docs/architecture/CREIXEMENT_*.md'
      - '.github/workflows/creixement-autonomous-core.yml'

permissions:
  contents: read

concurrency:
  group: creixement-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install core dependencies
        run: npm install --no-audit --no-fund
      - name: Core typecheck
        run: npm run check
      - name: Core unit tests
        run: npm test

  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Runtime typecheck
        run: npm run check
      - name: Runtime unit tests
        run: npm test
      - name: Runtime build
        run: npm run build

  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Creixement JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(config/creixement-*.json)
          if [ ${#files[@]} -eq 0 ]; then echo 'No Creixement JSON contracts found'; exit 1; fi
          for file in "${files[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('valid json:', process.argv[1])" "$file"
          done
      - name: Validate ordered migrations and trust contracts
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            db/migrations/002_autonomous_economic_brain.sql
            db/migrations/003_cloud_runtime_fabric.sql
            db/migrations/004_overhaul_v3_runtime_governance.sql
            db/migrations/005_overhaul_v4_company_os.sql
            db/migrations/006_v4_initial_operating_backlog.sql
            db/migrations/007_v4_goal_execution_semantics.sql
            db/migrations/008_v4_production_trust_fabric.sql
            db/migrations/009_v5_runtime_convergence.sql
          )
          for migration in "${migrations[@]}"; do test -f "$migration"; done
          grep -q 'execution_mode' db/migrations/007_v4_goal_execution_semantics.sql
          grep -q 'v_owner_action_queue_v4' db/migrations/007_v4_goal_execution_semantics.sql
          grep -q 'request_nonces_v4' db/migrations/008_v4_production_trust_fabric.sql
          grep -q 'capability_contracts_v4' db/migrations/008_v4_production_trust_fabric.sql
          grep -q 'lineage_nodes_v4' db/migrations/008_v4_production_trust_fabric.sql
          grep -q 'release_manifests_v4' db/migrations/008_v4_production_trust_fabric.sql
          grep -q 'runtime_heartbeats_v5' db/migrations/009_v5_runtime_convergence.sql
          grep -q 'job_dead_letters_v5' db/migrations/009_v5_runtime_convergence.sql
          grep -q 'creixement_reconcile_runtime_v5' db/migrations/009_v5_runtime_convergence.sql
          grep -q 'v_runtime_readiness_v5' db/migrations/009_v5_runtime_convergence.sql
          test -f cloud/creixement-runtime/api/tick.ts
          test -f cloud/creixement-runtime/api/health.ts
          test -f cloud/creixement-runtime/api/readiness.ts
          test -f cloud/creixement-runtime/vercel.json
          grep -q '17 3 \* \* \*' cloud/creixement-runtime/vercel.json
          echo 'ordered migrations and deployable runtime contracts present'
      - name: Reject active local-runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'Tectum Local Bridge|local_runtime_required|desktop Excel COM|local AutoPPTX' config cloud docs/architecture/CREIXEMENT_AUTONOMOUS_ECONOMIC_BRAIN_V2.md; then
            echo 'Active local-runtime regression detected.'
            exit 1
          fi
          echo 'cloud-only runtime boundary preserved'
