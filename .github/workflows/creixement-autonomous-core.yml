name: Creixement Autonomous Core

on:
  push:
    branches:
      - venture/creixement-control-plane-cloud-v1
      - venture/creixement-overhaul-v3
      - venture/creixement-overhaul-v4
      - venture/creixement-overhaul-v5
      - venture/creixement-overhaul-v6-converged
      - venture/creixement-kairon-v7
      - venture/creixement-kairon-v8-autonomic
      - venture/creixement-kairon-v9-bioecology
      - production/creixement-kairon
  pull_request:
    paths:
      - 'cloud/creixement-agent-core/**'
      - 'cloud/creixement-runtime/**'
      - 'cloud/creixement-cloudflare-runtime/**'
      - 'db/migrations/**'
      - 'config/creixement-*.json'
      - 'docs/architecture/CREIXEMENT_*.md'
      - '.github/workflows/creixement-autonomous-core.yml'

permissions:
  contents: read

concurrency:
  group: creixement-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install core dependencies
        run: npm install --no-audit --no-fund
      - name: Core typecheck
        run: npm run check
      - name: Core unit tests
        run: npm test

  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Runtime typecheck
        run: npm run check
      - name: Runtime unit tests
        run: npm test
      - name: Runtime build
        run: npm run build

  validate-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloud/creixement-cloudflare-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Cloudflare runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Cloudflare typecheck
        run: npm run check
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run

  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Creixement JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(config/creixement-*.json)
          if [ ${#files[@]} -eq 0 ]; then echo 'No Creixement JSON contracts found'; exit 1; fi
          for file in "${files[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('valid json:', process.argv[1])" "$file"
          done
      - name: Validate ordered migrations and Kairon V9 Conway contracts
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            db/migrations/002_autonomous_economic_brain.sql
            db/migrations/003_cloud_runtime_fabric.sql
            db/migrations/004_overhaul_v3_runtime_governance.sql
            db/migrations/005_overhaul_v4_company_os.sql
            db/migrations/006_v4_initial_operating_backlog.sql
            db/migrations/007_v4_goal_execution_semantics.sql
            db/migrations/008_v4_production_trust_fabric.sql
            db/migrations/009_v5_runtime_convergence.sql
            db/migrations/010_v6_autonomic_operations.sql
            db/migrations/011_v6_invariant_guards.sql
            db/migrations/012_v6_resilience_and_release_integrity.sql
            db/migrations/013_v6_verified_evidence_gates.sql
            db/migrations/014_v7_kairon_autonomous_operator.sql
            db/migrations/015_v7_kairon_schema_convergence.sql
            db/migrations/016_v8_kairon_runtime_contract.sql
            db/migrations/017_v8_release_attestation.sql
            db/migrations/018_v9_conway_bioecology.sql
            db/migrations/019_v9_conway_adversarial_courts.sql
          )
          for migration in "${migrations[@]}"; do test -f "$migration"; done
          grep -q 'creixement_kairon_preflight_v8' db/migrations/016_v8_kairon_runtime_contract.sql
          grep -q 'deployment_evidence_verified' db/migrations/017_v8_release_attestation.sql
          grep -q 'bio_mechanism_registry_v9' db/migrations/018_v9_conway_bioecology.sql
          grep -q 'slime_mold_routing' db/migrations/018_v9_conway_bioecology.sql
          grep -q 'immune_memory' db/migrations/018_v9_conway_bioecology.sql
          grep -q 'red_queen' db/migrations/018_v9_conway_bioecology.sql
          grep -q 'telomere_senescence' db/migrations/018_v9_conway_bioecology.sql
          grep -q 'constitutional_membrane' db/migrations/018_v9_conway_bioecology.sql
          grep -q 'evolution.bioecology_cycle' db/migrations/018_v9_conway_bioecology.sql
          grep -q 'adversarial_court_runs_v9' db/migrations/019_v9_conway_adversarial_courts.sql
          grep -q 'capability_canaries_v9' db/migrations/019_v9_conway_adversarial_courts.sql
          grep -q 'hysteresis_states_v9' db/migrations/019_v9_conway_adversarial_courts.sql
          grep -q 'authority_graph_v9' db/migrations/019_v9_conway_adversarial_courts.sql
          grep -q 'auditor_of_auditors' db/migrations/019_v9_conway_adversarial_courts.sql
          test -f config/creixement-kairon-v9.json
          test -f config/creixement-conway-v9.json
          node -e "const c=require('./config/creixement-kairon-v9.json'); if(c.operator.name!=='Kairon'||c.operator.autonomy_ceiling!=='L2'||c.operator.production_branch!=='production/creixement-kairon'||c.runtime.version!=='0.9.0'||c.operator.sentience_claims!==false) process.exit(1)"
          node -e "const c=require('./config/creixement-conway-v9.json'); if(c.migration_head!=='019_v9_conway_adversarial_courts.sql'||c.runtime_version!=='0.9.0'||!c.faustian_court.hard_veto_dominates_expected_value||c.slime_mold_court.max_paths!==200000) process.exit(1)"
          test -f cloud/creixement-agent-core/src/bioecology.ts
          test -f cloud/creixement-agent-core/src/bioecology.test.ts
          test -f cloud/creixement-agent-core/src/conwayEcology.ts
          test -f cloud/creixement-agent-core/src/conwayEcology.test.ts
          grep -q 'slimeMoldAllocate' cloud/creixement-agent-core/src/bioecology.ts
          grep -q 'redQueenPressure' cloud/creixement-agent-core/src/bioecology.ts
          grep -q 'immuneDecision' cloud/creixement-agent-core/src/bioecology.ts
          grep -q 'deterministicAuthorityTraversal' cloud/creixement-agent-core/src/conwayEcology.ts
          grep -q 'hardVetoSelection' cloud/creixement-agent-core/src/conwayEcology.ts
          grep -q 'updateHysteresis' cloud/creixement-agent-core/src/conwayEcology.ts
          grep -q 'canaryPromotion' cloud/creixement-agent-core/src/conwayEcology.ts
          grep -q 'auditorOfAuditors' cloud/creixement-agent-core/src/conwayEcology.ts
          test -f cloud/creixement-runtime/src/bioecologyHandler.ts
          test -f cloud/creixement-runtime/src/handlerRouterV9.ts
          grep -q 'evolution.bioecology_cycle' cloud/creixement-runtime/src/handlerRouterV9.ts
          grep -q 'handlerRouterV9' cloud/creixement-runtime/src/worker.ts
          grep -q '\*/5 \* \* \* \*' cloud/creixement-cloudflare-runtime/wrangler.toml
          grep -q 'production/creixement-kairon' cloud/creixement-cloudflare-runtime/wrangler.toml
          node -e "const p=require('./cloud/creixement-runtime/package.json'); if(p.version!=='0.9.0') process.exit(1)"
          node -e "const p=require('./cloud/creixement-cloudflare-runtime/package.json'); if(p.version!=='0.9.0') process.exit(1)"
          echo 'ordered migrations and Kairon V9 Conway ecology contracts present'
      - name: Reject active local-runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'Tectum Local Bridge|local_runtime_required|desktop Excel COM|local AutoPPTX' config cloud docs/architecture/CREIXEMENT_AUTONOMOUS_ECONOMIC_BRAIN_V2.md; then
            echo 'Active local-runtime regression detected.'
            exit 1
          fi
          echo 'cloud-only runtime boundary preserved'
