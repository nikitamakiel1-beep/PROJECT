name: Stage 010r synthetic reconciliation and rollback

on:
  pull_request:
    paths:
      - 'intelligence/real_estate/reconciliation*.py'
      - 'fixtures/real_estate/stage010r-*'
      - 'config/real-estate-synthetic-reconciliation.json'
      - 'automations/specs/A27-synthetic-real-estate-reconciliation.yaml'
      - 'scripts/*real_estate_reconciliation.py'
      - 'docs/architecture/REAL_ESTATE_SYNTHETIC_RECONCILIATION.md'
      - 'docs/handover/STAGE_010R_SYNTHETIC_RECONCILIATION.md'
      - 'MANIFEST.stage-010r.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository manifests and compilation
        run: python scripts/validate_repository.py
      - name: Validate A30 runtime
        run: python scripts/test_real_estate_runtime.py
      - name: Validate Stage 007r contracts
        run: python scripts/test_real_estate_synergy_system.py
      - name: Validate Stage 008r orchestrator
        run: python scripts/test_real_estate_synergy_orchestrator.py
      - name: Validate Stage 009r batch adapter
        run: python scripts/test_real_estate_synthetic_batch.py
      - name: Validate Stage 010r reconciliation and rollback
        run: python scripts/test_real_estate_reconciliation.py
      - name: Audit Stage 010r fail-closed boundary
        run: python scripts/audit_real_estate_reconciliation.py
