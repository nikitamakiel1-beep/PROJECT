name: Creixement Runtime Proof

on:
  push:
    branches:
      - production/creixement-kairon
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creixement-runtime-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-production-runtime:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/production/creixement-kairon'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Wait for exact Kairon V11 production proof
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUNTIME_PROOF_URL: https://creixement-kairon-runtime-nikitamakiel1-9651s-projects.vercel.app/api/diagz
        run: |
          set -euo pipefail
          last='{}'
          for attempt in $(seq 1 70); do
            payload="$(curl --silent --show-error --max-time 20 "$RUNTIME_PROOF_URL" || true)"
            if [ -z "$payload" ]; then
              echo "Runtime proof attempt ${attempt}: endpoint not ready"
              sleep 20
              continue
            fi
            last="$payload"
            state="$(PAYLOAD="$payload" EXPECTED_SHA="$EXPECTED_SHA" python - <<'PY'
          import json, os
          try:
              d=json.loads(os.environ['PAYLOAD'])
          except Exception:
              print('pending:non-json')
              raise SystemExit
          cfg=d.get('configuration') or {}
          hb=d.get('heartbeat') or {}
          cadence=d.get('cadence') or {}
          truth=d.get('truth') or {}
          expected=(os.environ.get('EXPECTED_SHA') or '')[:12]
          actual=str(cfg.get('commit') or '')[:12]
          checks={
            'vercelCompute': d.get('platform') == 'vercel-functions',
            'supabaseScheduler': d.get('scheduler') == 'supabase-pg-cron',
            'cloudflareRetiredAsAuthority': truth.get('cloudflareAuthoritative') is False,
            'exactDeployedCommit': bool(expected) and actual == expected,
            'heartbeatHealthy': hb.get('status') == 'healthy',
            'heartbeatFresh': hb.get('fresh') is True,
            'exactHeartbeatCommit': hb.get('commitMatches') is True,
            'cadenceStable': cadence.get('stable') is True,
            'schedulerVerified': cadence.get('schedulerVerified') is True,
          }
          failed=[k for k,v in checks.items() if not v]
          print('success' if not failed else 'pending:' + ','.join(failed))
          PY
            )"
            echo "Runtime proof attempt ${attempt}: ${state}"
            if [ "$state" = success ]; then
              echo "$payload" | python -m json.tool
              exit 0
            fi
            sleep 20
          done
          echo "$last" | python -m json.tool || true
          echo 'Timed out waiting for exact Kairon V11 Vercel/Supabase runtime proof.' >&2
          exit 1
