name = "creixement-kairon"
main = "src/entry.ts"
compatibility_date = "2026-09-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
SUPABASE_URL = "https://yjzmavbtwqvbiybcowgk.supabase.co"
CREIXEMENT_DB_RELAY_URL = "https://creixement-ops-hub.lovable.app/api/runtime-db"
CREIXEMENT_RUNTIME_ID = "kairon-cloudflare-v10"
CREIXEMENT_RUNTIME_VERSION = "1.0.0"
CREIXEMENT_BRANCH = "production/creixement-kairon"
CREIXEMENT_ENVIRONMENT = "production"
CREIXEMENT_DB_TIMEOUT_MS = "8000"
